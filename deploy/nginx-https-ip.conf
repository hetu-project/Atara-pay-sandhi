# Atara 控制台 · nginx 站点配置（裸 IP + HTTPS）
#
# 用在没有域名、拿 Let's Encrypt 的 IP 证书的情况下。
#
#   certbot certonly --webroot -w /srv/atara/dist \
#           --ip-address <IP> --preferred-profile shortlived
#   cp deploy/nginx-https-ip.conf /etc/nginx/sites-available/atara
#   sed -i 's/62\.146\.236\.64/<你的IP>/g' /etc/nginx/sites-available/atara
#   nginx -t && systemctl reload nginx
#
# 为什么手写而不是让 certbot --nginx 加：它在 server_name _ 的块上匹配不到，
# 会静默跳过配置修改，然后照样报成功——证书签出来了，nginx 却一行没改。

upstream atara_api {
    # 后端只监听回环地址。绑 0.0.0.0 的话 :8080 会绕过 nginx 直接暴露在公网。
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # 续期校验必须走明文 80，且不能被下面的跳转吃掉。
    # IP 证书只有 6 天有效期，续期一天要跑两次——这个 location 少了，
    # 站点会在某个周末悄无声息地过期。
    location /.well-known/acme-challenge/ {
        root /srv/atara/dist;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # nginx 1.24 用 listen 里的 http2；1.25+ 才是独立的 http2 指令
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/62.146.236.64/fullchain.pem;   # ← 改成你的 IP
    ssl_certificate_key /etc/letsencrypt/live/62.146.236.64/privkey.pem;     # ← 改成你的 IP
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    root /srv/atara/dist;
    index index.html;

    # ── 访问控制：这一版有意关掉了 ──────────────────────────────
    # 拿到地址的任何人都能进，能以任何身份下单（后端鉴权是 mock，
    # X-Atara-User 头直接注入身份），也能往 /api/v1/uploads 传文件。
    # 演示环境这么取舍没问题——里面的钱和身份都是假的。但因此：
    # 不要往里放任何真实证件或凭证，也不要拿它当真实业务的入口。
    #
    # 要加回来的话，二选一，都是加两行的事：
    #   auth_basic "Atara demo"; auth_basic_user_file /etc/nginx/.htpasswd;
    #   allow 203.0.113.7; deny all;

    # 演示站点不该被搜索引擎收录
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # ── API 反代 ────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://atara_api;        # 不带尾斜杠：保留完整 /api/v1/... 路径
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 16m;
        proxy_buffering off;
        proxy_read_timeout 75s;
    }

    # ── 静态资源 ────────────────────────────────────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag  "noindex, nofollow, noarchive" always;
        try_files $uri =404;
    }

    # SPA 回退：哈希路由刷新任意路径都要落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 两个 HTML 入口都不能缓存：文件名不带内容哈希，发版后浏览器会一直拿旧副本。
    # location 里只要出现 add_header，就不再继承 server 层的，所以要各写一遍。
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        add_header X-Robots-Tag  "noindex, nofollow, noarchive" always;
    }

    # api.html 之前漏了这条。它有一阵子被 SPA 回退成 index.html，那个响应
    # 被浏览器缓存下来；等真文件补上了，用户点「Atara API」看到的还是控制台，
    # 而且服务器这边一切正常，很难查。
    location = /api.html {
        add_header Cache-Control "no-store, must-revalidate";
        add_header X-Robots-Tag  "noindex, nofollow, noarchive" always;
    }

    # 上传目录不直接暴露：文件要经过后端，那里才知道谁有权看
    location /var/ { return 404; }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
