# Atara 控制台 · nginx 站点配置
#
# 前后端同源：静态文件由 nginx 发，/api 反代给本机后端。
# 同源意味着不需要 CORS——那是最省事也最不容易配错的一条路。
#
#   cp deploy/nginx.conf /etc/nginx/sites-available/atara
#   ln -s /etc/nginx/sites-available/atara /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx

upstream atara_api {
    # 后端只监听回环地址。绑 0.0.0.0 的话 :8080 会绕过 nginx 直接暴露在公网，
    # 下面所有的访问控制就都白做了。见 atara-pay.service 里的 ATARA_HTTP_ADDR。
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name atara.example.com;          # ← 改成你的域名
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name atara.example.com;          # ← 改成你的域名

    ssl_certificate     /etc/letsencrypt/live/atara.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/atara.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /srv/atara/dist;                   # ← app/dist 的部署位置
    index index.html;

    # ── 访问控制 ────────────────────────────────────────────────
    # 后端鉴权目前是 mock：X-Atara-User 头直接注入身份，不校验任何凭证。
    # 也就是说任何人都能扮成任何人。在真鉴权做好之前，这道 Basic Auth
    # 是唯一挡在外面的东西——不要删。
    #
    #   htpasswd -c /etc/nginx/.htpasswd atara
    auth_basic           "Atara demo";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # ── API 反代 ────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://atara_api;        # 不带尾斜杠：保留完整 /api/v1/... 路径
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 凭证与证件上传：后端自己封顶 16MB，这里给同样的额度
        client_max_body_size 16m;

        # 工单状态由后端调度器推进，前端每秒轮询一次——别缓存
        proxy_buffering off;
        proxy_read_timeout 75s;
    }

    # ── 静态资源 ────────────────────────────────────────────────
    # 文件名带内容哈希，可以长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 回退：哈希路由刷新任意路径都要落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 绝不能缓存，否则发版后用户拿到的还是旧的 JS 文件名
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # 上传目录不直接暴露：文件要经过后端，那里才知道谁有权看
    location /var/ { return 404; }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
