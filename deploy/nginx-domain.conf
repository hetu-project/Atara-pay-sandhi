# Atara 控制台 · nginx 站点配置（域名 + HTTPS）
#
# 这份是**给 certbot 吃的起点**，只监听 80。不要手写 443 块：
# 证书还没签出来的时候，ssl_certificate 指向的文件不存在，nginx -t 直接失败，
# 而 certbot --nginx 又需要 nginx 是活的才能做校验——先有鸡还是先有蛋。
#
# 正确顺序：
#
#   1. DNS 加一条 A 记录：atara.example.com → 服务器 IP，等它生效
#        dig +short atara.example.com
#   2. 把下面的 server_name 改成你的域名
#   3. cp deploy/nginx-domain.conf /etc/nginx/sites-available/atara
#      ln -sf /etc/nginx/sites-available/atara /etc/nginx/sites-enabled/
#      nginx -t && systemctl reload nginx
#   4. certbot --nginx -d atara.example.com
#      —— 它会自动往这个文件里加 443 块、证书路径和 80→443 跳转
#   5. 去 Privy 后台把 https://atara.example.com 加进 allowed origins，
#      否则登录弹窗能弹但登不进去（见 PrivyRoot.tsx 的注释）
#
# 拿到 HTTPS 之后 Privy 的托管钱包才会打开——明文 HTTP 下它会抛异常，
# 前端因此走降级分支：没有 Twitter 登录，Google 的地址改由后端按邮箱派生。

upstream atara_api {
    # 后端只监听回环地址。绑 0.0.0.0 的话 :8080 会绕过 nginx 直接暴露在公网，
    # 下面所有的访问控制就都白做了。见 atara-pay.service 里的 ATARA_HTTP_ADDR。
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name atara.example.com;          # ← 改成你的域名

    root /srv/atara/dist;                   # ← app/dist 的部署位置
    index index.html;

    # ── 访问控制：这一版有意关掉了 ──────────────────────────────
    # 拿到 IP 和端口的任何人都能进，能以任何身份下单（后端鉴权是 mock，
    # X-Atara-User 头直接注入身份），也能往 /api/v1/uploads 传文件。
    # 演示环境这么取舍没问题——里面的钱和身份都是假的。但因此：
    # 不要往里放任何真实证件或凭证，也不要拿它当真实业务的入口。
    #
    # 要加回来的话，二选一，都是加两行的事：
    #   auth_basic "Atara demo"; auth_basic_user_file /etc/nginx/.htpasswd;
    #   allow 203.0.113.7; deny all;

    # 演示站点不该被搜索引擎收录——扫描器顺着索引找过来是最常见的暴露方式
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # ── API 反代 ────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://atara_api;        # 不带尾斜杠：保留完整 /api/v1/... 路径
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 凭证与证件上传：后端自己封顶 16MB，这里给同样的额度
        client_max_body_size 16m;

        # 工单状态由后端调度器推进，前端每秒轮询一次——别缓存
        proxy_buffering off;
        proxy_read_timeout 75s;
    }

    # ── 静态资源 ────────────────────────────────────────────────
    # 文件名带内容哈希，可以长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag  "noindex, nofollow, noarchive" always;
        try_files $uri =404;
    }

    # SPA 回退：哈希路由刷新任意路径都要落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 绝不能缓存，否则发版后用户拿到的还是旧的 JS 文件名。
    # 这里要重复一遍 X-Robots-Tag：location 里只要出现 add_header，
    # 就不再继承 server 层的那条了。
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        add_header X-Robots-Tag  "noindex, nofollow, noarchive" always;
    }

    # 上传目录不直接暴露：文件要经过后端，那里才知道谁有权看
    location /var/ { return 404; }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
