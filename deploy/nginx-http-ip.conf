# Atara 控制台 · nginx 站点配置（HTTP + 裸 IP，无证书）
#
#   访问方式：http://<服务器IP>:8090
#
#   cp deploy/nginx-http-ip.conf /etc/nginx/sites-available/atara
#   ln -s /etc/nginx/sites-available/atara /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# ⚠ 这份配置没有 TLS，是明知代价后的选择——Let's Encrypt 不给裸 IP 签证书。
#
#   后果说清楚：这套系统目前唯一的访问控制就是下面那道 Basic Auth
#   （后端鉴权是 mock，X-Atara-User 头直接注入身份，零校验）。而 Basic Auth
#   在明文 HTTP 上传的密码只是 base64，等于明文——从浏览器到这台机器之间
#   任何一跳都能读到，读到就能进。
#
#   所以：只在可信网络里演示，密码不要复用任何别处在用的密码，
#   更不要往里放任何真实的证件或凭证。拿到域名之后换 nginx-https-domain.conf。

upstream atara_api {
    # 后端只监听回环地址。绑 0.0.0.0 的话 :8080 会绕过 nginx 直接暴露在公网，
    # 下面所有的访问控制就都白做了。见 atara-pay.service 里的 ATARA_HTTP_ADDR。
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 8090;                            # ← 换端口改这里
    # 用裸 IP 访问，没有域名可匹配，所以收下这个端口上的一切请求
    server_name _;

    root /srv/atara/dist;                   # ← app/dist 的部署位置
    index index.html;

    # ── 访问控制：这一版有意关掉了 ──────────────────────────────
    # 现在这个地址是**完全公开**的：拿到 IP 和端口的任何人都能进，
    # 能以任何身份下单（后端鉴权是 mock，X-Atara-User 头直接注入身份），
    # 也能往 /api/v1/uploads 传文件（单个封顶 16MB）。
    #
    # 这是明知代价后的选择——它是个演示环境，里面的钱和身份都是假的。
    # 但因此：不要往里放任何真实证件或凭证，也不要拿它当任何真实业务的入口。
    #
    # 要加回来的话，二选一，都是加两行的事：
    #
    #   密码（需要 apt install apache2-utils，再 htpasswd -c /etc/nginx/.htpasswd atara）
    #   auth_basic           "Atara demo";
    #   auth_basic_user_file /etc/nginx/.htpasswd;
    #
    #   或者按来源 IP 放行（有固定出口 IP 时比密码更结实，也不用维护密码文件）
    #   allow 203.0.113.7;
    #   deny  all;

    # 没有 TLS 就更不该被搜索引擎收录——扫描器顺着索引找过来是最常见的暴露方式
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # ── API 反代 ────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://atara_api;        # 不带尾斜杠：保留完整 /api/v1/... 路径
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 凭证与证件上传：后端自己封顶 16MB，这里给同样的额度
        client_max_body_size 16m;

        # 工单状态由后端调度器推进，前端每秒轮询一次——别缓存
        proxy_buffering off;
        proxy_read_timeout 75s;
    }

    # ── 静态资源 ────────────────────────────────────────────────
    # 文件名带内容哈希，可以长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag  "noindex, nofollow, noarchive" always;
        try_files $uri =404;
    }

    # SPA 回退：哈希路由刷新任意路径都要落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 绝不能缓存，否则发版后用户拿到的还是旧的 JS 文件名。
    # 这里要重复一遍 X-Robots-Tag：location 里只要出现 add_header，
    # 就不再继承 server 层的那条了。
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        add_header X-Robots-Tag  "noindex, nofollow, noarchive" always;
    }

    # 上传目录不直接暴露：文件要经过后端，那里才知道谁有权看
    location /var/ { return 404; }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
